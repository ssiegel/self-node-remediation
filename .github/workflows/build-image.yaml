name: Build Container Image

# Triggered by the sync-upstream-tags workflow pushing a patched tag.
# The patched tag commit includes our workflow files, so this trigger fires normally.
# NOTE: the push in sync-upstream-tags.yaml must use a PAT (SYNC_TOKEN secret),
# not GITHUB_TOKEN, because GitHub does not trigger downstream workflows from
# pushes made with GITHUB_TOKEN.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  image: ghcr.io/${{ github.repository }} # ghcr.io/<owner>/<repo>
  registry_user: ${{ github.actor }}
  registry_token: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Configure Docker Build Cache
      id: cache
      uses: int128/docker-build-cache-config-action@v1
      with:
        image: ${{ env.image }}
        flavor: prefix=buildcache-

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.image }}
        tags: |
          type=ref,event=tag

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.image }}
        username: ${{ env.registry_user }}
        password: ${{ env.registry_token }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64,linux/arm64
        context: .
        file: ./Dockerfile
        provenance: false
        sbom: false
        cache-from: ${{ steps.cache.outputs.cache-from }}
        cache-to: ${{ steps.cache.outputs.cache-to }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: true
